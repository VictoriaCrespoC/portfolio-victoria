<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Portfolio de Victoria Crespo Cruz</title>
    <meta name="description" content="Portfolio personal con proyectos de HTML, CSS y JavaScript.">


    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/skills.css">
    <link rel="stylesheet" href="../css/cheatsheets.css">
    <link rel="stylesheet" href="../css/resources.css">
    <link rel="stylesheet" href="../css/darkmode.css">
    
  </head>
  <body>
    <div id="header-container"></div>
    <main>
      <section class="formulario">
        <h2>Contacto</h2>
        <p>¿Te gustaría contactar conmigo o compartir alguna idea? Escribe tu mensaje</p>
        <form action="/Enviar" method="post">
        <fieldset>
          <legend>Tus datos</legend>
          <div>
            <label for="name">Nombre</label>
            <input type="text" id="name" name="nombre" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div>
            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" name="asunto"  required>
          </div>
          <div>
            <label class="mensaje" for="mensaje">Mensaje</label>
            <textarea name="mensaje" id="mensaje" placeholder="Escribe tu mensaje aquí..." rows=5></textarea>
          </div>

          <input class="Enviar" type="submit" value="Enviar">
          <button class="Borrar" type="reset">Borrar todo</button>

        </fieldset>
      </form>

      </section>
    </main>
    <div id="footer-container"></div>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>

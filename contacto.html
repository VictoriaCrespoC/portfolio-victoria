        <h2>Contacto</h2>
        <p>¿Te gustaría contactar conmigo o compartir alguna idea? Escribe tu mensaje</p>
        <form action="/Enviar" method="post">
        <fieldset>
          <legend>Tus datos</legend>
          <div>
            <label for="name">Nombre</label>
            <input type="text" id="name" name="nombre" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div>
            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" name="asunto"  required>
          </div>
          <div>
            <label class="mensaje" for="mensaje">Mensaje</label>
            <textarea name="mensaje" id="mensaje" placeholder="Escribe tu mensaje aquí..." rows=5></textarea>
          </div>

          <input class="Enviar" type="submit" value="Enviar">
          <button class="Borrar" type="reset">Borrar todo</button>

        </fieldset>
      </form>
